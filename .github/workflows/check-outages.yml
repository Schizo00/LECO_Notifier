name: Check LECO outages

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}

jobs:
  check-leco-outages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install

      - name: Run notifier (retry on failure)
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
        run: |
          for attempt in 1 2 3; do
            poetry run leco-check && exit 0
            status=$?
            echo "Attempt $attempt failed (exit $status)."
            if [ "$attempt" -lt 3 ]; then
              echo "Retrying in 5 minutes..."
              sleep 300
            fi
          done
          echo "All 3 attempts failed."
          exit 1

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || git commit -m "Update notification state [skip ci]"
          git push
