[project]
name = "leco-notifier"
version = "1.0.0"
description = "Scrapes LECO planned power interruption notices and emails subscribers when their street is listed"
requires-python = ">=3.10"
dependencies = [
    "requests (>=2.31,<3.0)",
    "beautifulsoup4 (>=4.12,<5.0)",
    "lxml (>=6.1.3,<7.0.0)",
]

[project.scripts]
leco-check = "leco_notifier.main:main"
leco-add-subscriber = "leco_notifier.add_subscriber:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]
